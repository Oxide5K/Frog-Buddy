[package]
name = "frog-buddy"
version = "2.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
tray-icon = "0.26.1"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_SystemInformation"] }

[profile.release]
strip = true
lto = true
opt-level = "s"

[build-dependencies]
winresource = "0.1"
